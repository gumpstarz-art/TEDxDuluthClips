name: Deploy to Azure Container Apps

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/tedxclips:${{ github.sha }} .
          docker tag ${{ secrets.ACR_LOGIN_SERVER }}/tedxclips:${{ github.sha }} ${{ secrets.ACR_LOGIN_SERVER }}/tedxclips:latest

      - name: Push Docker image
        run: |
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/tedxclips:${{ github.sha }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/tedxclips:latest

      - name: Deploy to Azure Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          imageToDeploy: ${{ secrets.ACR_LOGIN_SERVER }}/tedxclips:${{ github.sha }}
          containerAppName: tedxclips-app
          resourceGroup: tedxclips-rg
          containerAppEnvironment: tedxclips-env

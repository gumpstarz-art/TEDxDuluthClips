name: Trigger auto deployment for clipmaker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/clipmaker:${{ github.sha }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CLIPMAKER_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CLIPMAKER_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CLIPMAKER_AZURE_SUBSCRIPTION_ID }}

      - name: Deploy image to Azure Container App
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az containerapp update \
              --name clipmaker \
              --resource-group TEDxDuluth \
              --image ghcr.io/${{ github.repository }}/clipmaker:${{ github.sha }}

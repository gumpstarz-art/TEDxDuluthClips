name: Trigger auto deployment for clipmaker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CLIPMAKER_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CLIPMAKER_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CLIPMAKER_AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          appSourcePath: ${{ github.workspace }}
          containerAppName: clipmaker
          resourceGroup: TEDxDuluth
          dockerfilePath: Dockerfile

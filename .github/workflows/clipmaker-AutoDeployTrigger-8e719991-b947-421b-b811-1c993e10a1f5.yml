name: Trigger auto deployment for clipmaker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name ${{ secrets.CONTAINER_REGISTRY_NAME || 'tedxduluth' }}

      - name: Build and push image
        run: |
          ACR_NAME="${{ secrets.CONTAINER_REGISTRY_NAME || 'tedxduluth' }}.azurecr.io"
          IMAGE_TAG="${ACR_NAME}/clipmaker:${{ github.sha }}"
          
          docker build -t "$IMAGE_TAG" -t "${ACR_NAME}/clipmaker:latest" .
          docker push "$IMAGE_TAG"
          docker push "${ACR_NAME}/clipmaker:latest"

      - name: Deploy to Azure Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          appSourcePath: ${{ github.workspace }}
          containerAppName: clipmaker
          resourceGroup: TEDxDuluth
          imageToDeploy: ${{ secrets.CONTAINER_REGISTRY_NAME || 'tedxduluth' }}.azurecr.io/clipmaker:${{ github.sha }}
